<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="author" content="Suit Pro London" />
    <meta name="description" content="SuitPro retail POS and inventory system for boutiques and small stores." />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>SuitPro • Retail POS</title>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background:radial-gradient(circle at top,#1f2937 0%,#020617 65%,#01040a 100%);display:flex;align-items:center;justify-content:center;font-family:Segoe UI,Arial,sans-serif;color:#f8fafc;">
        <div style="width:min(92vw,560px);padding:28px 30px;border:1px solid rgba(223,183,108,0.25);border-radius:18px;background:rgba(2,6,23,0.9);box-shadow:0 24px 70px rgba(0,0,0,0.32);text-align:center;">
          <div style="font-size:24px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;">SuitPro</div>
          <div style="margin-top:10px;color:#cbd5e1;font-size:13px;">Loading your retail workspace…</div>
          <div style="margin-top:18px;height:8px;width:100%;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;">
            <div style="display:block;width:45%;height:100%;background:linear-gradient(90deg,#fbbf24,#dfb76c);animation:loadPulse 1.1s infinite ease-in-out;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
